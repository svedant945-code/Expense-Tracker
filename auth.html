<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker - Sign In</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg: #f0f2f5;
      --bg-card: rgba(255, 255, 255, 0.65);
      --bg-glass: rgba(255, 255, 255, 0.45);
      --border-glass: rgba(255, 255, 255, 0.4);
      --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.07);
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --input-bg: rgba(255, 255, 255, 0.7);
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #eef2ff;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 24px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.75);
      --bg-glass: rgba(30, 41, 59, 0.55);
      --border-glass: rgba(255, 255, 255, 0.08);
      --shadow-glass: 0 8px 32px rgba(0, 0, 0, 0.3);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #334155;
      --input-bg: rgba(30, 41, 59, 0.7);
      --primary: #818cf8;
      --primary-dark: #6366f1;
      --primary-light: #1e1b4b;
      --error: #f87171;
      --error-bg: #450a0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      min-height: 100vh;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background var(--transition), color var(--transition);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-glass);
      padding: 40px 32px;
      animation: fadeUp 0.5s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo {
      width: 64px;
      height: 64px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.5rem;
      color: white;
    }

    .auth-title { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .auth-subtitle { color: var(--text-secondary); font-size: 0.95rem; }

    .auth-tabs {
      display: flex;
      background: var(--input-bg);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .auth-tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
    }

    .auth-tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-family: inherit;
      color: var(--text);
      background: var(--input-bg);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    .field input::placeholder { color: var(--text-muted); }
    .field-error {
      display: block;
      min-height: 1.2rem;
      font-size: 0.8rem;
      color: var(--error);
      margin-top: 6px;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .field-error.show { opacity: 1; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .auth-footer { text-align: center; margin-top: 24px; color: var(--text-secondary); font-size: 0.9rem; }
    .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius);
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      animation: toastIn 0.35s ease;
    }
    .toast.toast-out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(40px); } }
    .toast i { font-size: 1.1rem; }
    .toast.success i { color: #059669; }
    .toast.error i { color: var(--error); }
    .toast.info i { color: var(--primary); }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo"><i class="fas fa-wallet"></i></div>
        <h1 class="auth-title">Expense Tracker</h1>
        <p class="auth-subtitle">Sign in to manage your finances</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab" data-tab="register">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form class="auth-form active" id="loginForm" novalidate>
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required />
          <span class="field-error" id="loginEmailError"></span>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password" required />
          <span class="field-error" id="loginPasswordError"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="registerForm" novalidate>
        <div class="field">
          <label for="registerName">Name</label>
          <input type="text" id="registerName" placeholder="Your name" autocomplete="name" required />
          <span class="field-error" id="registerNameError"></span>
        </div>
        <div class="field">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="you@example.com" autocomplete="email" required />
          <span class="field-error" id="registerEmailError"></span>
        </div>
        <div class="field">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />
          <span class="field-error" id="registerPasswordError"></span>
        </div>
        <div class="field">
          <label for="registerConfirm">Confirm Password</label>
          <input type="password" id="registerConfirm" placeholder="Confirm password" autocomplete="new-password" required />
          <span class="field-error" id="registerConfirmError"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="registerBtn"><i class="fas fa-user-plus"></i> Create Account</button>
      </form>

      <div class="auth-footer">
        <p>By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api/v1';
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => [...document.querySelectorAll(sel)];

    // DOM
    const loginForm = $('#loginForm');
    const registerForm = $('#registerForm');
    const loginEmail = $('#loginEmail');
    const loginPassword = $('#loginPassword');
    const registerName = $('#registerName');
    const registerEmail = $('#registerEmail');
    const registerPassword = $('#registerPassword');
    const registerConfirm = $('#registerConfirm');
    const loginBtn = $('#loginBtn');
    const registerBtn = $('#registerBtn');
    const toastContainer = $('#toastContainer');
    const tabs = $$('.auth-tab');

    // State
    let currentTab = 'login';

    // Helpers
    function showError(el, msg) { el.textContent = msg; el.classList.add('show'); }
    function hideError(el) { el.textContent = ''; el.classList.remove('show'); }
    function setLoading(btn, loading) {
      btn.disabled = loading;
      btn.innerHTML = loading ? '<i class="fas fa-spinner fa-spin"></i> Please wait...' : btn.dataset.original;
    }

    function showToast(message, type = 'info') {
      const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle' };
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i><span>${message}</span>`;
      toastContainer.appendChild(toast);
      setTimeout(() => { toast.classList.add('toast-out'); setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function switchTab(tab) {
      currentTab = tab;
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
      loginForm.classList.toggle('active', tab === 'login');
      registerForm.classList.toggle('active', tab === 'register');
      // Clear errors
      $$('.field-error').forEach(e => hideError(e));
    }

    tabs.forEach(tab => tab.addEventListener('click', () => switchTab(tab.dataset.tab)));

    // API
    async function apiRequest(endpoint, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...options.headers };
      const token = localStorage.getItem('auth_token');
      if (token) headers.Authorization = `Bearer ${token}`;

      const res = await fetch(`${API_BASE}${endpoint}`, { ...options, cache: 'no-store', headers });
      const data = await res.json().catch(() => ({}));

      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      let valid = true;

      if (!loginEmail.value.trim()) { showError($('#loginEmailError'), 'Email is required'); valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(loginEmail.value)) { showError($('#loginEmailError'), 'Invalid email format'); valid = false; }
      else hideError($('#loginEmailError'));

      if (!loginPassword.value) { showError($('#loginPasswordError'), 'Password is required'); valid = false; }
      else hideError($('#loginPasswordError'));

      if (!valid) return;

      loginBtn.dataset.original = loginBtn.dataset.original || loginBtn.innerHTML;
      setLoading(loginBtn, true);

      try {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: loginEmail.value.trim(), password: loginPassword.value })
        });
        localStorage.setItem('auth_token', data.token);
        showToast('Welcome back!', 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(loginBtn, false);
      }
    });

    // Register
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      let valid = true;

      if (!registerName.value.trim()) { showError($('#registerNameError'), 'Name is required'); valid = false; }
      else hideError($('#registerNameError'));

      if (!registerEmail.value.trim()) { showError($('#registerEmailError'), 'Email is required'); valid = false; }
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(registerEmail.value)) { showError($('#registerEmailError'), 'Invalid email format'); valid = false; }
      else hideError($('#registerEmailError'));

      if (!registerPassword.value) { showError($('#registerPasswordError'), 'Password is required'); valid = false; }
      else if (registerPassword.value.length < 8) { showError($('#registerPasswordError'), 'Minimum 8 characters'); valid = false; }
      else hideError($('#registerPasswordError'));

      if (registerPassword.value !== registerConfirm.value) { showError($('#registerConfirmError'), 'Passwords do not match'); valid = false; }
      else hideError($('#registerConfirmError'));

      if (!valid) return;

      registerBtn.dataset.original = registerBtn.dataset.original || registerBtn.innerHTML;
      setLoading(registerBtn, true);

      try {
        const data = await apiRequest('/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            name: registerName.value.trim(),
            email: registerEmail.value.trim(),
            password: registerPassword.value
          })
        });
        localStorage.setItem('auth_token', data.token);
        showToast('Account created successfully!', 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setLoading(registerBtn, false);
      }
    });

    // Input clear errors
    [loginEmail, loginPassword, registerName, registerEmail, registerPassword, registerConfirm].forEach(input => {
      input.addEventListener('input', () => hideError($('#' + input.id + 'Error')));
    });

    // Only redirect when the saved token is still valid.
    (async function checkExistingSession() {
      const token = localStorage.getItem('auth_token');
      if (!token) return;

      try {
        const res = await fetch(`${API_BASE}/auth/me`, {
          cache: 'no-store',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (res.ok) {
          window.location.href = 'index.html';
          return;
        }

        localStorage.removeItem('auth_token');
      } catch {
        localStorage.removeItem('auth_token');
      }
    })();
  </script>
</body>
</html>
